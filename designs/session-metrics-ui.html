<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migent · Session metrics</title>
<style>
/* Preview shell. The webview part below maps --mg-* to VS Code theme variables in the real page
   (media/shared/base.css). Here they get dark defaults so this file opens in any browser. */
:root{
  color-scheme:dark;
  --bg:#111;--panel:#181818;--chrome:#12151a;--line:#2b2b2b;
  --mg-fg:#ccc;--mg-muted:#8f8f8f;--mg-link:#75beff;--mg-border:#333;
  --mg-focus:#007fd4;--mg-surface:#1f1f1f;--mg-hover:#ffffff12;
  --mg-ok:#89d185;--mg-warn:#cca700;--mg-error:#f48771;--mg-info:#9da5b0;
  --mg-bar:#4a9edd;
  --mg-radius:4px;--mg-space-1:4px;--mg-space-2:8px;--mg-space-3:12px;--mg-space-4:16px;--mg-space-5:24px;
  --mg-font:'Segoe UI',sans-serif;--mg-font-size:13px;--mg-mono:Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--mg-fg);font:var(--mg-font-size) var(--mg-font)}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

/* Review chrome */
.preview{min-height:64px;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--chrome);border-bottom:1px solid #333}
.preview strong{color:#eee;font-size:14px}
.preview p{margin:4px 0 0;color:#919aa8;font-size:12px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls label{color:#aaa;font-size:12px}
select{background:#252930;border:1px solid #414750;padding:6px 9px;border-radius:4px}
.frame{max-width:1100px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-top:0}
.tabbar{display:flex;background:#141414;border-bottom:1px solid var(--line)}
.tab{padding:8px 14px;font-size:12px;color:#9d9d9d;border-right:1px solid var(--line);cursor:default}
.tab.active{color:#eee;background:var(--panel);border-top:1px solid var(--mg-link)}
.webview{display:block;padding:0 20px 32px;max-width:960px}

/* ---- Subset of media/shared/base.css, the components the page reuses ---- */
.mg-muted{color:var(--mg-muted)}
.mg-warn{color:var(--mg-warn)}
.mg-error{color:var(--mg-error)}
.mg-mono{font-family:var(--mg-mono);overflow-wrap:anywhere}
.mg-header{margin:var(--mg-space-4) 0 var(--mg-space-4)}
.mg-title{font-size:1.6em;font-weight:600;margin:var(--mg-space-1) 0;overflow-wrap:anywhere}
.mg-subtitle{color:var(--mg-muted);margin:0 0 var(--mg-space-3);overflow-wrap:anywhere}
.mg-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--mg-space-2)}
.mg-status{display:inline-flex;align-items:center;gap:var(--mg-space-1);font-weight:600;color:var(--mg-info)}
.mg-status--ok{color:var(--mg-ok)}
.mg-status--warn{color:var(--mg-warn)}
.mg-status--error{color:var(--mg-error)}
.mg-btn{display:inline-flex;align-items:center;gap:var(--mg-space-1);border:1px solid transparent;border-radius:2px;padding:4px 12px}
.mg-btn--primary{color:#fff;background:#0078d4}
.mg-btn--primary:hover{background:#026ec1}
.mg-btn--secondary{color:#ccc;background:#313131}
.mg-btn--secondary:hover{background:#3c3c3c}
.mg-section{margin:var(--mg-space-5) 0 0}
.mg-section>h2{font-size:1.1em;font-weight:600;margin:0 0 var(--mg-space-2)}
.mg-list{list-style:none;padding:0;margin:0}
.mg-list>li{border-bottom:1px solid var(--mg-border)}
.mg-list>li:last-child{border-bottom:0}
.mg-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--mg-space-3);width:100%;padding:var(--mg-space-2) var(--mg-space-1);text-align:left;border:1px solid transparent;border-radius:var(--mg-radius)}
.mg-row-main{min-width:0;overflow-wrap:anywhere}
.mg-row-meta{flex:none;max-width:55%;color:var(--mg-muted);text-align:right;overflow-wrap:anywhere}
.mg-pill{display:inline-block;padding:0 var(--mg-space-2);font-size:.9em;line-height:1.6;color:#fff;background:#4d4d4d;border:1px solid transparent;border-radius:10px;white-space:nowrap}
.mg-pill--warn{background:#5a4a00;color:#f0d47a}
.mg-pill--error{background:#5a1d1d;color:#f0a0a0}
.mg-details{margin:var(--mg-space-2) 0 0;border:1px solid var(--mg-border);border-radius:var(--mg-radius)}
.mg-details>summary{cursor:pointer;padding:var(--mg-space-2) var(--mg-space-3);user-select:none}
.mg-details[open]>summary{border-bottom:1px solid var(--mg-border)}
.mg-details .mg-details-body{padding:var(--mg-space-3)}
.mg-details h3{font-size:1em;margin:var(--mg-space-3) 0 var(--mg-space-1)}
.mg-details h3:first-child{margin-top:0}
.mg-btn:focus-visible,.mg-details>summary:focus-visible{outline:1px solid var(--mg-focus);outline-offset:2px}

/* ---- Page layout (media/sessionmetrics/sessionmetrics.css) ---- */
.metrics-banner{display:flex;gap:var(--mg-space-2);align-items:flex-start;margin:0 0 var(--mg-space-2);padding:var(--mg-space-2) var(--mg-space-3);border:1px solid var(--mg-border);border-left:3px solid var(--mg-warn);border-radius:var(--mg-radius);background:var(--mg-surface)}
.metrics-banner--error{border-left-color:var(--mg-error)}
.metrics-banner p{margin:0}
.metrics-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--mg-space-2);margin:0}
.metrics-stat{padding:var(--mg-space-3);border:1px solid var(--mg-border);border-radius:var(--mg-radius);background:var(--mg-surface)}
.metrics-stat dt{color:var(--mg-muted);font-size:.9em;margin:0}
.metrics-stat dd{margin:var(--mg-space-1) 0 0;font-size:1.35em;font-weight:600;font-variant-numeric:tabular-nums}
.metrics-stat .metrics-note{display:block;margin-top:var(--mg-space-1);font-size:.85em;font-weight:400;color:var(--mg-muted)}
.metrics-note--warn{color:var(--mg-warn)}
.metrics-bar{height:6px;margin-top:var(--mg-space-1);background:var(--mg-border);border-radius:3px;overflow:hidden}
.metrics-bar>span{display:block;height:100%;background:var(--mg-bar);border-radius:3px}
.metrics-bar--quiet>span{background:var(--mg-info)}
.metrics-row-stack{display:block}
.metrics-row-value{display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.metrics-exec-summary{display:flex;align-items:baseline;justify-content:space-between;gap:var(--mg-space-3)}
.metrics-exec-title{min-width:0;overflow-wrap:anywhere}
.metrics-exec-meta{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:var(--mg-space-1);justify-content:flex-end}
.metrics-kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--mg-space-1) var(--mg-space-3);margin:0}
.metrics-kv dt{color:var(--mg-muted)}
.metrics-kv dd{margin:0;overflow-wrap:anywhere}
.metrics-plain{list-style:none;padding:0;margin:0}
.metrics-plain>li{padding:var(--mg-space-1) 0}
.metrics-empty{padding:var(--mg-space-3) 0}
.metrics-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;z-index:20;padding:8px 14px;background:#252930;border:1px solid #414750;border-radius:4px;color:#eee;font-size:12px}
</style>
</head>
<body>
<header class="preview">
  <div>
    <strong>Migent / Session metrics</strong>
    <p>Mô phỏng giao diện · trang con của một session đã hoàn thành · dữ liệu mẫu, không kết nối CLI</p>
  </div>
  <div class="controls">
    <label for="scenario">Kịch bản</label>
    <select id="scenario">
      <option value="partial">Chi phí thiếu một phần (file thật)</option>
      <option value="many">Nhiều execution (file thật)</option>
      <option value="verify">Verify đỏ và stage không có role</option>
      <option value="missing">Session không có metrics</option>
      <option value="invalid">metrics.json lỗi</option>
    </select>
  </div>
</header>
<div class="frame">
  <div class="tabbar">
    <div class="tab">✓ plan · Results</div>
    <div class="tab active" id="tabTitle">✓ plan · Metrics ×</div>
  </div>
  <main class="webview" id="root"></main>
</div>
<script src="session-metrics-ui.js"></script>
</body>
</html>
