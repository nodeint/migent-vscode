schema_version: 8
id: pr

artifacts:
  pr:
    file: pr.md
    description: Branch, commit, pull request URL, CI result, and any failures or skipped checks.

stages:
  - id: open_pr
    role: operator
    ask: human
    instructions:
      - With phase_commit, require a clean tree and all phases committed in current history; otherwise stop.
      - Follow the create-pr skill in .agents/skills/create-pr/SKILL.md for committing, pushing, and opening the pull request against next.
      - Use the prior implement-summary when provided for the summary, changes, and verification; otherwise derive them from the diff.
      - Write Fixes #<n> under Related issue when a prior issue artifact names an issue; otherwise write None.
    artifacts: [pr]
