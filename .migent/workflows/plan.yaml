schema_version: 7
constraints:
  - Plan only. Do not modify source code.
stages:
  - id: plan
    role: planner
    max_revisions: 3
    ask: human
    instructions:
      - Define the goal, scope, and architectural constraints from the task and repository evidence.
      - Design component responsibilities, boundaries, contracts, and dependencies.
      - Favor maintainability and extensibility. Keep the design proportional to the task.
      - Explain key decisions, trade-offs, risks, and open questions.
      - Stay at the architecture level. Exclude implementation steps, code-level details, and test procedures.
      - Resolve substantive review findings when revising.
    artifacts: [ plan ]
  - id: review_plan
    role: reviewer
    depends_on:
      - plan
    instructions:
      - Review the architecture against the task and repository evidence.
      - Assess correctness, feasibility, maintainability, and extensibility.
      - Check responsibilities, boundaries, contracts, dependencies, and material trade-offs or risks.
      - Stay at the architecture level. Do not require implementation steps, code-level details, or test procedures.
      - Report all substantive gaps together with their impact and required corrections.
      - Choose revise for substantive gaps; otherwise choose approved.
      - Do not revise for style or formatting.
    decision:
      - approved:
          when: Choose approved according to the stage instructions.
          navigate: complete
      - revise:
          when: Choose revise according to the stage instructions.
          navigate: plan
          artifacts:
            review:
              file: review.md
      - approved_with_comments:
          navigate: complete
          artifacts: [ plan-comment ]
downstream:
  - workflow: implement
    task: implement approved workflow
    artifacts:
      approved_plan: plan
artifacts:
  plan:
    file: plan.md
    required: true
    description: x
  plan-comment:
    file: plan-comments.md
    required: false
id: plan
concurrency: 1
