schema_version: 8
id: issue
constraints:
  - Triage only. Do not change files other than issue.md or run commands beyond git and gh; investigate by reading code, documentation, and GitHub only to choose the next workflow.

artifacts:
  issue:
    file: issue.md
    description: Issue summary using the Summary template section of .agents/skills/checkout-issue/SKILL.md, including the recommended next workflow with its reason.

stages:
  - id: triage
    role: operator
    ask: human
    instructions:
      - Triage the GitHub issue named in the task by following the checkout-issue skill in .agents/skills/checkout-issue/SKILL.md.
      - This workflow is a checkout request; create the working branch per steps 5-6 of the skill.
      - Recommend the next workflow and why, citing the triage evidence - product when requirements, user scenarios, or scope need definition; design when the scope crosses contracts or module boundaries, a bug's cause is unclear, or the solution needs structural decisions; implement when one module owns the change and its solution is obvious.
      - Base the recommendation on available evidence, explain its uncertainty, and do not present it as the human's decision. If information is insufficient to choose the next step, ask the human rather than choosing a workflow.
    artifacts: [issue]

downstream:
  - workflow: product
    task: Specify product requirements, user scenarios, and acceptance criteria for the triaged issue.
  - workflow: design
    task: Design the solution for the triaged issue.
  - workflow: implement
    task: Evaluate the triaged issue's recommendation and implement if direct implementation is appropriate.
