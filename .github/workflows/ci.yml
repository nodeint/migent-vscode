name: CI

on:
  push:
    branches: [next]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Integration tests (VS Code 1.93.0)
        timeout-minutes: 10
        run: pnpm test:integration --versions 1.93.0
      - name: Integration tests (VS Code 1.145.0)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: pnpm test:integration --versions 1.145.0
      - name: Upload integration diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.os }}
          path: dist-test/
          if-no-files-found: ignore
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'
          if-no-files-found: error
