<head>
<meta charset="utf-8">

<title>Migent · Phase 2 UI preview</title>
<style>
:root{color-scheme:dark;--bg:#1f1f1f;--panel:#181818;--line:#2b2b2b;--text:#ccc;--muted:#858585;--blue:#75beff;--green:#89d185;--yellow:#cca700;--red:#f48771}*{box-sizing:border-box}body{margin:0;background:#111;color:var(--text);font:13px 'Segoe UI',sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:hover{background:#ffffff12}button:focus-visible,summary:focus-visible,select:focus-visible{outline:1px solid #007fd4;outline-offset:-1px}button:disabled{cursor:default;opacity:.4} .preview{min-height:68px;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #333;background:#12151a}.preview strong{color:#eee;font-size:14px}.preview p{margin:4px 0 0;color:#919aa8;font-size:12px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{color:#aaa;font-size:12px}select{background:#252930;border:1px solid #414750;padding:6px 9px;border-radius:4px}.frame{height:calc(100vh - 68px);min-height:640px;display:grid;grid-template-rows:35px 1fr 23px}.titlebar{display:flex;align-items:center;gap:22px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px}.logo{color:#23a9f2;font-size:18px}.search{margin:auto;width:38%;text-align:center;background:#ffffff09;border:1px solid #ffffff17;border-radius:5px;padding:3px;color:#aaa}.window{letter-spacing:17px;color:#999}.workbench{display:grid;grid-template-columns:48px 390px minmax(0,1fr);min-height:0}.activity{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch}.activity button{height:49px;color:#888;font-size:23px;position:relative}.activity button.active{color:#eee;border-left:2px solid #0078d4}.activity small{position:absolute;right:4px;bottom:4px;background:#0078d4;color:white;font-size:10px;border-radius:9px;min-width:16px;padding:1px}.spacer{flex:1}.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow:auto}.sidehead{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;font-size:11px;letter-spacing:1px}.tools{display:flex;gap:3px;letter-spacing:0}.tools button{font-size:17px;padding:3px 6px}.section{padding:6px 11px;font-size:11px;font-weight:650;display:flex;align-items:center;gap:6px}.badge{margin-left:auto;border-radius:12px;background:#454545;padding:1px 6px;font-size:10px}.tree{padding-bottom:20px}details>summary{list-style:none;cursor:pointer;min-height:27px;display:flex;align-items:center;gap:6px;padding-right:8px;white-space:nowrap}summary::-webkit-details-marker{display:none}summary:before{content:'›';font-size:17px;width:10px;flex-shrink:0;color:#aaa}details[open]>summary:before{content:'⌄';font-size:14px}summary:hover,.file:hover{background:#2a2d2e}.group>summary{padding-left:11px;font-size:11px;font-weight:650}.session>summary{padding-left:24px}.execution>summary{padding-left:43px}.folder>summary{padding-left:64px}.label{overflow:hidden;text-overflow:ellipsis}.desc{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;flex-shrink:2}.state{width:16px;text-align:center;flex-shrink:0}.running{color:var(--blue)}.blocked{color:#e2c263}.failed{color:var(--red)}.completed{color:var(--green)}.stopped,.prepared,.cancelled{color:#aaa}.selected{background:#04395e!important;color:white}.file{display:flex;align-items:center;width:100%;gap:8px;height:26px;text-align:left;padding-left:79px;white-space:nowrap}.file.output{padding-left:61px}.file span{color:#8cbfdb}.more{color:#aaa;padding:7px 0 7px 43px;font-size:12px}.main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}.tabs{height:35px;display:flex;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}.tab{border-top:1px solid #0078d4;border-right:1px solid var(--line);padding:8px 15px;background:var(--bg);font-size:12px}.tab span{color:#75beff;margin-right:7px}.crumb{padding:9px 20px;color:#999;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.editor{overflow:auto;flex:1;padding:15px 30px 40px 20px;font:13px/1.85 Consolas,'Courier New',monospace;counter-reset:line}.code-line{display:flex;min-height:24px;white-space:pre-wrap;overflow-wrap:anywhere}.code-line:before{counter-increment:line;content:counter(line);color:#6e7681;min-width:34px;text-align:right;margin-right:24px;user-select:none}.code-line.heading{color:#569cd6}.code-line.good{color:#89d185}.code-line.warn{color:#dcdcaa}.output-panel{height:209px;border-top:1px solid #414141;flex-shrink:0}.panelhead{height:36px;display:flex;align-items:center;gap:19px;padding:0 19px;font-size:11px}.panelhead .active{color:white;border-bottom:1px solid white;height:100%;display:flex;align-items:center}.channel{margin-left:auto;color:#bbb}.logs{margin:2px 20px;font:12px/1.9 Consolas,monospace;white-space:pre-wrap;color:#aaa;overflow:auto;height:160px}.logs .time{color:#777}.logs .info{color:#75beff}.statusbar{display:flex;align-items:center;background:var(--panel);border-top:1px solid var(--line);font-size:12px;gap:15px;padding-right:12px}.remote{background:#0078d4;padding:2px 12px;color:#fff}.statusbar button{height:22px;font-size:12px}.statusbar .right{margin-left:auto;color:#aaa}.welcome{padding:26px 22px;color:#aaa;line-height:1.6}.welcome h3{font-size:14px;font-weight:500;color:#ddd;margin:0 0 10px}.primary{background:#0078d4;color:white;width:100%;padding:6px;margin:12px 0}.primary:hover{background:#168bdc}.welcome button:disabled{display:block;width:100%;border:1px solid #555;padding:6px;margin:8px 0}.welcome small{font-size:11px;color:#888}.menu{position:fixed;z-index:10;display:none;background:#252526;border:1px solid #454545;box-shadow:0 5px 20px #0008;padding:5px;border-radius:4px;min-width:200px}.menu button{display:block;width:100%;text-align:left;padding:6px 15px;font-size:12px}.menu button:hover{background:#04395e}.menu hr{border:0;border-top:1px solid #444;margin:4px}.toast{position:fixed;right:24px;bottom:45px;background:#252526;border:1px solid #454545;padding:13px 20px;box-shadow:0 6px 20px #0006;display:none;z-index:20}.empty-editor{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:'Segoe UI',sans-serif;color:#777;text-align:center}.empty-editor .mark{font-size:74px;color:#383838}.empty-editor p{max-width:400px;line-height:1.8}.project{font-size:11px;padding:7px 13px;color:#aaa}.hint{color:#777;font-size:11px;padding:15px 20px;line-height:1.6;border-top:1px solid var(--line)}@media(max-width:1000px){.workbench{grid-template-columns:44px 320px minmax(0,1fr)}.titlebar .nav{display:none}.preview{padding:10px 15px}.output-panel{height:180px}.panelhead{gap:10px}.channel{max-width:170px;overflow:hidden;white-space:nowrap}.desc{font-size:10px}}@media(max-width:700px){.workbench{grid-template-columns:40px 260px minmax(300px,1fr)}.frame{overflow:auto}.preview{flex-wrap:wrap}.frame{height:calc(100vh - 110px)}.window{display:none}.search{width:60%}}
</style>
</head>
<body>
<header class="preview"><div><strong>Migent / Monitoring</strong><p>Mô phỏng tương tác · Phase 2 · Dữ liệu mẫu, không kết nối CLI</p></div><div class="controls"><label for="scenario">Kịch bản</label><select id="scenario"><option value="active">Đang chạy & cần chú ý</option><option value="completed">Hoàn tất & outputs</option><option value="multi">Workspace nhiều project</option><option value="empty">Chưa có session</option><option value="project">Chưa khởi tạo project</option><option value="missing">Chưa cài CLI</option><option value="old">CLI cần cập nhật</option></select><button id="simulate" title="Mô phỏng sự kiện từ CLI chạy ngoài terminal">▷ Mô phỏng cập nhật</button></div></header>
<div class="frame"><div class="titlebar"><span class="logo">◈</span><span class="nav">File &nbsp; Edit &nbsp; Selection &nbsp; View &nbsp; Go &nbsp; Run &nbsp; Terminal &nbsp; Help</span><div class="search">⌕ &nbsp; migent — Visual Studio Code</div><span class="window">─ □ ×</span></div>
<div class="workbench"><nav class="activity" aria-label="Activity bar"><button title="Explorer">▱</button><button title="Search">⌕</button><button title="Source Control">⑂</button><button title="Run and Debug">▷</button><button title="Extensions">▦</button><button class="active" id="migent" title="Migent">◈<small id="activityBadge">2</small></button><div class="spacer"></div><button title="Accounts">◎</button><button title="Migent settings" id="settings">⚙</button></nav>
<aside class="sidebar"><div class="sidehead">MIGENT<div class="tools"><button id="refresh" title="Refresh">↻</button><button id="openSettings" title="Open Settings">⚙</button></div></div><div class="section">⌄ &nbsp; SESSIONS <span class="badge" id="badge">2</span></div><div id="tree" class="tree"></div></aside>
<main class="main"><div class="tabs"><div class="tab" id="tab"></div></div><div class="crumb" id="crumb"></div><div class="editor" id="editor"></div><section class="output-panel"><div class="panelhead"><span>PROBLEMS</span><span class="active">OUTPUT</span><span>DEBUG CONSOLE</span><span>TERMINAL</span><span class="channel" id="channel"></span><button id="timeline" title="Open session timeline">↗</button></div><div class="logs" id="logs"></div></section></main></div>
<footer class="statusbar"><span class="remote">❯❮</span><span>⑂ main</span><span>⊗ 0 &nbsp; ⚠ 0</span><button id="status"></button><span class="right" id="editorStatus">Ln 1, Col 1 &nbsp;&nbsp; UTF-8 &nbsp;&nbsp; Markdown</span><span>♧</span></footer></div>
<div class="menu" id="menu"></div><div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const symbols={running:'◌',blocked:'⚠',failed:'⊗',stopped:'Ⅱ',completed:'✓',cancelled:'⊘',prepared:'○'};
const sessions=[
 {id:'s-20261030-auth',title:'Add authentication middleware',workflow:'feature',stage:'implement',elapsed:'4m 32s',state:'running',executions:[['plan',1,'completed','approved'],['implement',1,'running','']]},
 {id:'s-20261030-tests',title:'Improve session reader coverage',workflow:'maintenance',stage:'verify',elapsed:'1m 18s',state:'running',executions:[['implement',1,'completed','done'],['verify',1,'running','']]},
 {id:'s-20261030-lock',title:'Handle stale locks on Windows',workflow:'feature',stage:'review',elapsed:'12m',state:'blocked',reason:'Review needs a decision: wait for a foreign-host heartbeat or mark its lock stale?',executions:[['plan',1,'completed','approved'],['implement',1,'completed','done'],['review',1,'blocked','revise']]},
 {id:'s-20261030-watch',title:'Fix watcher event reconciliation',workflow:'bugfix',stage:'verify',elapsed:'8m',state:'failed',reason:'verify · attempt 2: watcher reconciliation timed out after 3 retries.',executions:[['implement',1,'completed','done'],['verify',2,'failed','failed']]},
 {id:'s-20261029-cli',title:'Document CLI installation',workflow:'docs',stage:'write',elapsed:'6m',state:'stopped',executions:[['write',1,'completed','done']]},
 {id:'s-20261029-paths',title:'Normalize workspace paths',workflow:'bugfix',stage:'verify',elapsed:'7m 08s',state:'completed',executions:[['plan',1,'completed','approved'],['implement',1,'completed','done'],['verify',1,'completed','passed']]},
 {id:'s-20261029-docs',title:'Update contributor guide',workflow:'docs',stage:'write',elapsed:'2m',state:'cancelled',executions:[['write',1,'cancelled','']]},
 {id:'s-20261029-config',title:'Validate workflow configuration',workflow:'feature',stage:'plan',elapsed:'—',state:'prepared',executions:[]}
];
let current=sessions[0], doc='timeline', scenario='active', updated=false, showMore=false, toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3200)}
function file(name,sid,stage,extra=''){return `<button class="file ${extra}" data-file="${esc(name)}" data-session="${sid}" data-stage="${stage||''}"><span>${name.endsWith('.md')?'M↓':'◇'}</span>${esc(name)}</button>`}
function sessionTree(s){const expanded=s.id===current.id;return `<details class="session" ${expanded?'open':''}><summary data-session="${s.id}" title="${esc(s.title+'\n'+s.id+'\n'+s.state+' · '+s.workflow+' · '+s.stage+' · '+s.elapsed+(s.reason?'\n'+s.reason:''))}"><span class="state ${s.state}">${symbols[s.state]}</span><span class="label">${esc(s.title)}</span><span class="desc">${s.workflow} · ${s.stage} · ${s.elapsed}</span></summary>${s.executions.map(([stage,attempt,state,decision],i)=>`<details class="execution" ${expanded&&i===s.executions.length-1?'open':''}><summary title="codex/gpt-5 · ${state}"><span class="state ${state}">${symbols[state]}</span><span>${stage} · attempt ${attempt}</span><span class="desc">codex/gpt-5${decision?' · '+decision:''}</span></summary>${file('prompt.md',s.id,stage)}${state!=='running'?file('response.md',s.id,stage):''}<details class="folder"><summary>▱ verify</summary>${file('verify.md',s.id,stage)}</details><details class="folder"><summary>▱ artifacts</summary>${file('notes.md',s.id,stage)}</details></details>`).join('')}${s.state==='completed'?`<details class="folder" open><summary>▱ Outputs</summary>${file('summary.md',s.id,'','output')}${file('changes.patch',s.id,'','output')}</details>`:''}</details>`}
function renderTree(){const welcome=['empty','project'].includes(scenario);$('simulate').disabled=welcome||['missing','old'].includes(scenario);const needs=welcome?0:sessions.filter(s=>['blocked','failed'].includes(s.state)).length;for(const id of ['badge','activityBadge']){$(id).textContent=needs;$(id).style.display=needs?'':'none'}
 if(welcome){const config={empty:['No sessions yet','Các session chạy từ terminal sẽ tự xuất hiện tại đây.'],project:['Initialize your project','Workspace này chưa có thư mục .migent.'],missing:['Migent CLI not found','Cài Migent CLI trong môi trường đang mở workspace để bật monitoring.'],old:['Update Migent CLI','Phiên bản CLI hiện tại thấp hơn migent.cli.minVersion. Monitoring ở chế độ chỉ đọc.']}[scenario];$('tree').innerHTML=`<div class="welcome"><h3>${config[0]}</h3><p>${config[1]}</p>${['missing','old'].includes(scenario)?'<button class="primary" data-install>Install CLI · Instructions</button>':''}<button disabled>Initialize project</button><button disabled>Run workflow</button><small>Initialize và Run workflow sẽ có ở phase 3–4.</small></div>`;$('status').textContent='';return}
 let capability=['missing','old'].includes(scenario)?'<div class="hint guard">'+(scenario==='missing'?'CLI not found.':'CLI version is below migent.cli.minVersion.')+' Disk-based monitoring remains available.<br><button class="primary" data-install>Install CLI · Instructions</button></div>':''; let html=capability+(scenario==='multi'?'<div class="project">⌄ &nbsp; MIGENT</div>':'');for(const [title,states] of [['Running',['running']],['Needs attention',['blocked','failed','stopped']],['Recent',['completed','cancelled','prepared']]]){const list=sessions.filter(s=>states.includes(s.state));if(list.length)html+=`<details class="group" open><summary>${title}</summary>${list.map(sessionTree).join('')}${title==='Recent'?`<button class="more" id="more">${showMore?'Earlier archived session · completed':'Show more…'}</button>`:''}</details>`}if(scenario==='multi')html+='<details class="group"><summary>MIGENT-VSCODE</summary><div class="hint">No sessions in this project.</div></details>';
 $('tree').innerHTML=html;
 const running=sessions.filter(s=>s.state==='running').length;$('status').textContent=running?`◌ Migent: ${running} running${needs?' · '+needs+' needs attention':''}`:(needs?`⚠ ${needs} needs attention`:'');
}
function lines(){if(doc==='settings')return ['# Migent settings','','migent.cli.path         migent','migent.cli.minVersion   (minimum supported CLI version)','migent.sessions.limit   50','','Các giá trị minh họa; xem default thực tế khi implement.'];if(doc==='install')return ['# Install Migent CLI','','1. Cài Migent CLI theo hướng dẫn trong repository Migent.','2. Đảm bảo migent có trong PATH hoặc đặt migent.cli.path.','3. Kiểm tra: migent --version','4. Mở lại workspace hoặc chọn Refresh.','','Remote / WSL: cài CLI trong môi trường chứa workspace.'];if(doc==='timeline')return [`# ${current.title}`,`# Session: ${current.id}`,`# Workflow: ${current.workflow} · State: ${current.state}`,`# Context: ${current.reason||'No blocker reported.'}`,'',...current.executions.flatMap(([stage,attempt,state,decision],i)=>[`10:${15+i*2}:30  ${stage}#${attempt} started · codex/gpt-5`,state==='running'?`10:${15+i*2}:36  ${stage}#${attempt} running · Waiting for provider response`:`10:${16+i*2}:08  ${stage}#${attempt} ${state}${decision?' · '+decision:''}`]),...(updated&&current===sessions[0]?['10:21:04  session completed · Outputs published']:[])];if(doc==='task.md')return [`# ${current.title}`,'',`Workflow: ${current.workflow}`,'','Implement the requested change in the current repository.','Follow the project conventions and verify the result.'];if(doc==='prompt.md')return [`# ${current.stage} · ${current.title}`,'','You are working in the migent repository.','',`Task: ${current.title}.`,'','## Requirements','- Follow the approved plan.','- Keep changes focused and preserve public contracts.','- Run the relevant checks and report the results.'];if(doc==='response.md')return [`# Execution response`,'',`Stage: ${current.stage}`,`Session: ${current.id}`,'','Implemented the requested changes.','',current.state==='blocked'?'Decision: revise — clarify lock expiry behavior.':'Decision: done','',current.state==='blocked'?'The review requests a decision on foreign-host lock handling.':'Relevant checks completed successfully.'];if(doc==='summary.md')return [`# ${current.title}`,'','## Result','Normalized workspace paths across Windows and POSIX.','','## Validation','✓ Path normalization checks passed.','✓ Type checking passed.','','Published from the completed session.'];if(doc==='changes.patch')return ['diff --git a/src/core/paths.ts b/src/core/paths.ts','--- a/src/core/paths.ts','+++ b/src/core/paths.ts','@@ -12,1 +12,1 @@','- return projectPath + "/.migent";','+ return path.join(projectPath, ".migent");'];return [`# ${doc}`,'',`Session: ${current.id}`,'',doc==='verify.md'?(current.state==='failed'?'Verification failed: watcher event reconciliation timed out.':'Verification passed.'): 'Execution notes and supporting artifacts.']}
function renderDoc(){const special=['settings','install'].includes(doc);const title=doc==='timeline'?`${current.id} · timeline`:doc;$('tab').innerHTML=`<span>${doc==='timeline'?'≡':'M↓'}</span>${esc(title)} &nbsp; ×`;$('crumb').textContent=special?'Migent › '+doc:doc==='timeline'?`migent-session:/${current.id}/timeline`:`migent › .migent › sessions › ${current.id} › ${['task.md','summary.md','changes.patch'].includes(doc)?(doc==='task.md'?'':'outputs › '):'executions › '+current.stage+'-1 › '}${doc}`;$('editor').innerHTML=lines().map(l=>`<div class="code-line ${l.startsWith('#')?'heading':l.includes('failed')||l.includes('revise')?'warn':l.startsWith('✓')||l.includes('completed')?'good':''}">${esc(l)||' '}</div>`).join('');$('channel').textContent=`Migent: ${current.title}`;$('logs').innerHTML=current.executions.map(([stage,attempt,state,decision],i)=>`<span class="time">10:${15+i*2}:30</span> <span class="info">[info]</span> ${esc(stage)}#${attempt} started · codex/gpt-5\n<span class="time">10:${16+i*2}:08</span> [${state==='failed'?'error':'info'}] ${esc(stage)}#${attempt} ${state}${decision?' · '+esc(decision):''}`).join('\n');$('editorStatus').textContent=`Ln 1, Col 1   UTF-8   ${doc==='timeline'?'Log':'Markdown'}`}
function render(){renderTree();if(['empty','project'].includes(scenario)){$('tab').textContent='Welcome';$('crumb').textContent='';$('editor').innerHTML='<div class="empty-editor"><div class="mark">◈</div><p>Migent<br>Sessions, execution files & live logs</p></div>';$('channel').textContent='Migent';$('logs').textContent='';}else renderDoc()}
$('scenario').onchange=e=>{scenario=e.target.value;current=scenario==='completed'?sessions[5]:sessions[0];doc=scenario==='completed'?'summary.md':'timeline';render()};
$('tree').addEventListener('click',e=>{const f=e.target.closest('[data-file]');if(f){current=sessions.find(s=>s.id===f.dataset.session);doc=f.dataset.file;renderDoc();document.querySelectorAll('.file').forEach(n=>n.classList.toggle('selected',n===f))}if(e.target.closest('[data-install]')){doc='install';renderDoc()}if(e.target.id==='more'){showMore=!showMore;notify('Mô phỏng tải thêm session theo migent.sessions.limit');renderTree()}});
function contextMenu(e){const s=e.target.closest('summary[data-session]');if(!s)return;e.preventDefault();current=sessions.find(x=>x.id===s.dataset.session);const menu=$('menu');menu.innerHTML=[['task.md','Open Task'],['timeline','Show Session Log'],['copy','Copy Session ID'],['reveal','Reveal in Explorer']].map(([action,label])=>`<button data-action="${action}">${label}</button>`).join('');menu.style.display='block';menu.style.left=Math.min(e.clientX,innerWidth-220)+'px';menu.style.top=Math.min(e.clientY,innerHeight-170)+'px'}
$('tree').addEventListener('contextmenu',contextMenu);$('menu').onclick=async e=>{const action=e.target.dataset.action;if(action==='copy'){try{await navigator.clipboard.writeText(current.id);notify('Copied: '+current.id)}catch{notify('Session ID: '+current.id)}}else if(action==='reveal')notify(`Đường dẫn mô phỏng: .migent/sessions/${current.id}`);else if(action){doc=action;renderDoc()}$('menu').style.display='none'};document.addEventListener('click',e=>{if(!e.target.closest('.menu'))$('menu').style.display='none'});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('menu').style.display='none'});
$('timeline').onclick=()=>{doc='timeline';renderDoc()};function settings(){doc='settings';renderDoc()}$('settings').onclick=settings;$('openSettings').onclick=settings;$('refresh').onclick=()=>{renderTree();notify('Refreshed · Dữ liệu mô phỏng đã được tải lại')};function focusSessions(){$('tree').scrollIntoView({block:'nearest'});$('tree').animate([{background:'#04395e'},{background:'transparent'}],{duration:650})}$('status').onclick=focusSessions;$('migent').onclick=focusSessions;
$('simulate').onclick=()=>{updated=!updated;const s=sessions[0];s.state=updated?'completed':'running';s.stage=updated?'verify':'implement';s.elapsed=updated?'5m 04s':'4m 32s';s.executions=updated?[['plan',1,'completed','approved'],['implement',1,'completed','done'],['verify',1,'completed','passed']]:[['plan',1,'completed','approved'],['implement',1,'running','']];current=s;doc='timeline';render();notify(updated?'Sự kiện mô phỏng: Running → Completed · Tree, timeline và status bar đã cập nhật':'Sự kiện mô phỏng: session đang Running')};render();
</script>
<script src="project-files-ui.js"></script>
</body>
</html>
